# 사용통계 공개 시차(개월): 발간월 M에 쓸 수 있는 사용통계는 M−5까지. P1 S6 리포트와 P2가 같은 값을 쓴다.
# 근거 (사용자 확인 2026-11-16): 발생 후 5개월 뒤 초본 공개 (예: 11월 1일에 6월 초본), 이후 매달 과거 자료 수정본 + 새 초본.
# data/raw 사용통계(2018~2025)는 2026-11-01에 받은 수정본이다. 폴더명 날짜는 그 판의 공개일일 뿐이다 (DECISIONS 2026-11-16).
usage_lag_months: &usage_lag 5

p1:
  start_month: "2022-01"
  end_month: "2025-12"
  signal_followup_months: 3      # 신호 실현 추적 기간
  sample_start: "2024-01"        # 회귀 시험 표본 구간
  sample_end: "2025-12"
  validation_sample_size: 60

p2:
  start_month: "2018-01"
  end_month: "2025-12"
  origin_start: "2023-01"
  origin_end: "2025-09"
  horizons: [1, 2, 3]
  top_n: 200                     # 2022년 원외 청구수량 상위 성분 수
  target: "claim_qty"            # 원외 청구수량. 보조: claim_cnt
  covid_months: ["2020-01", "2021-12"]
  flu_season_months: [11, 12, 1, 2, 3]
  usage_publication_lag_months: [*usage_lag, 0]   # 첫째 = 기본 평가 (위 usage_lag_months, P1과 같은 값), 0 = 참고 (PLAN_P2 §5)
  quantiles: [0.5, 0.9]
  order_sim:
    review_period_months: 1
    lead_time_months: 1
    cost_ratios: [1, 3, 9]       # 결품 비용 / 재고 비용 (가정값)
