# 사용통계 공개 시차(개월): 처방 연월 M의 사용통계를 쓸 수 있는 첫 리포트 달 − M. P1 S6 리포트와 P2가 같은 값을 쓴다.
# null = 미정 (원자료 파일명에는 연 단위 묶음의 현재 판 공개일만 있고 달별 첫 공개일이 없다, DECISIONS 2026-11-16).
# 미정이면 리포트는 0개월로 계산하고 "공개 시차 미정"을 표시한다.
usage_lag_months: &usage_lag null

p1:
  start_month: "2022-01"
  end_month: "2025-12"
  signal_followup_months: 3      # 신호 실현 추적 기간
  sample_start: "2024-01"        # 회귀 시험 표본 구간
  sample_end: "2025-12"
