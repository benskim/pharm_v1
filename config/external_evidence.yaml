    note: "(주)마더스제약 3개 품목 집행정지 인용 (2025-01-31까지). 집행정지 날짜는 데이터 비고 2024-02-29 (기사 보도일 2024-03-04). 2심에서 인하 처분 취소 (2026-09-08 보도, 분석 기간 밖)"
