# P1 S6 월간 리포트 설정 (PLAN_P1 §6 S6, DECISIONS 2026-11-16). 바꾸면 DECISIONS에 기록한다.

# F1 영향 규모
impact:
  base_months: 3                 # 기준 월 U = (MONTH − usage_lag_months − 2) ~ (MONTH − usage_lag_months)
  # 전가율 적용 월 영향(참고) = 상한금액 기준 월 영향 × pass_through_ratio
  # 출처: reports/P1_S5_result.md §14, B1 주 지표(유효일 달 일수 가중) 쌍별 비율 y/x 중앙값 0.460 (outputs/s5/b1_main.csv eff_daywt)
  pass_through_ratio: 0.46

# F6 대체조제 순위표 본문에서 뺄 최고/최저 비율 기준 (미만은 본문에서 빼고 뺀 수를 적는다)
subst_min_ratio: 1.1

# F3 성분 묶음: short_name = 표시 이름에서 괄호 내용, 숫자로 시작하는 함량 토큰, 단위 토큰, 아래 염·수화물 단어를 뺀 이름.
# 첫 단어는 빼지 않는다 (예: sodium hyaluronate, magnesium oxide는 그대로). 복합제는 묶지 않는다 (성분4 그대로).
salt_words: [hydrochloride, dihydrochloride, hcl, hydrobromide, citrate, phosphate, sodium, disodium, calcium, magnesium,
             potassium, dipotassium, besylate, besilate, mesylate, mesilate, maleate, fumarate, succinate, tartrate,
             bitartrate, sulfate, bisulfate, acetate, nitrate, lactate, gluconate, tosylate, camsylate, oxalate, bromide,
             hydrate, monohydrate, dihydrate, trihydrate, hemihydrate, sesquihydrate, anhydrous, micronized, as]
unit_words: [mg, g, ml, l, μg, ug, ㎍, iu, i.u, i.u., kiu, mu, u, "%", gbq, mbq, mci]
# 수동 덮어쓰기: 성분4 → group_key (잘못 묶인 것을 고친다). 예: "1234": "c4:1234"
group_overrides:
  # 사용자 결정 2026-11-16: calcium(acetate / gluconate), human insulin(일반형 / N70·R30 혼합형)을 나눈다
  "1217": "calcium acetate"
  "1222": "calcium gluconate"
  "1701": "human insulin"
  "1704": "human insulin n70/r30"
